AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  MigrationScope — S3 (private, OAC-only) + CloudFront (HTTPS CDN) for the
  static site, plus a small Lambda + HTTP API that generates optional
  AI-assisted narrative text (Claude Haiku) for the "Show AI narrative"
  toggle. The site works fully without it — the narrative call is optional
  and falls back to deterministic templates on any failure.

Parameters:
  ProjectName:
    Type: String
    Default: migration-scope
  AllowedOrigin:
    Type: String
    Description: CloudFront origin allowed to call the narrative API (plus localhost dev ports, always allowed below).
    Default: https://d1v64qdf60rhoq.cloudfront.net

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        # Hash-based routing (#/applications, #/import, ...) means the browser
        # only ever requests /index.html — no SPA path-fallback rewriting needed.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # --- Optional AI narrative backend -----------------------------------
  # Public, unauthenticated, read-only-in-effect endpoint (it only explains
  # numbers already computed client-side). Throttled as a cost guard since
  # each call is a small but real, non-free-tier Anthropic API charge.

  NarrativeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
          - 'http://localhost:5173'
          - 'http://localhost:5186'
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  NarrativeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-narrative'
      CodeUri: backend/narrative-lambda/
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          ANTHROPIC_KEY_PARAMETER: /migration-scope/anthropic-api-key
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/migration-scope/anthropic-api-key'
      Events:
        Narrative:
          Type: HttpApi
          Properties:
            ApiId: !Ref NarrativeApi
            Path: /narrative
            Method: post

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  WebsiteURL:
    Value: !Sub 'https://${Distribution.DomainName}'
  NarrativeApiUrl:
    Description: Base URL for the narrative API — set as VITE_NARRATIVE_API_URL at build time.
    Value: !Sub 'https://${NarrativeApi}.execute-api.${AWS::Region}.amazonaws.com/narrative'
